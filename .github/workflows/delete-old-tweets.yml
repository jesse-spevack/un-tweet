name: Delete Old Tweets

on:
  schedule:
    # TESTING: Run at 14:18 UTC, revert to '0 7 * * *' after
    - cron: '18 14 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  delete-tweets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run delete script
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          TWITTER_USER_ID: ${{ secrets.TWITTER_USER_ID }}
          DAYS_TO_KEEP: "0.001"  # ~1.4 minutes for testing, revert to ${{ secrets.DAYS_TO_KEEP }}
        run: npm start

      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update tweet archive"
          git push
